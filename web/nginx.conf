# Web container: serves the built Vite assets and proxies API calls.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Web container's own health check.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    # API health (used by the page status indicator).
    location = /api/health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
